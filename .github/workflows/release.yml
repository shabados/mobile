name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: true

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  prepare:
    runs-on: ubuntu-latest
    needs: checks
    outputs:
      release-version: ${{ steps.bump-version.outputs.next }}
    steps:
      - uses: shabados/actions/setup-git-identity@release/v3
        with:
          user: Shabad OS Bot
          email: team@shabados.com
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_BOT_TOKEN }}
      - uses: shabados/actions/bump-version@release/v3
        id: bump-version
      - uses: shabados/actions/generate-changelog@release/v3
      - uses: ./.github/actions/upload-workspace

  build-and-submit:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        profile: [next, latest]
        platform: [ios, android]
        os: [macos-14, ubuntu-latest]
        exclude:
          - platform: android
            os: macos-14
          - platform: ios
            os: ubuntu-latest
    env:
      API_KEY_PATH: /tmp/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/download-workspace
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - run: bun i
      - uses: ./.github/actions/cache-pods
        if: matrix.platform == 'ios'
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version-file: .tool-versions
          cache: gradle
      - name: Create App Store Connect API Key
        if: matrix.platform == 'ios'
        run: |
          echo $API_KEY | base64 -d > ${{ env.API_KEY_PATH }}
        shell: bash
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      - run: |
          bun run build -- \
            --non-interactive \
            --auto-submit \
            --platform ${{ matrix.platform }} \
            --profile ${{ matrix.profile }}
        shell: bash
        env:
          EAS_LOCAL_BUILD_SKIP_CLEANUP: '1'
          EXPO_APPLE_TEAM_TYPE: COMPANY_OR_ORGANIZATION
          EXPO_APPLE_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          EXPO_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          EXPO_ASC_KEY_PATH: ${{ env.API_KEY_PATH }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}-${{ matrix.platform }}
          path: |
            **/*.aab
            **/*.ipa
